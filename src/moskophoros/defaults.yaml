# moskophoros's shipped defaults: every setting a settings file can hold, with
# the value used when no layer above sets it. A user file
# ($XDG_CONFIG_HOME/moskophoros/config.yaml, else
# ~/.config/moskophoros/config.yaml) or a --config file may set any of them;
# a key it leaves out falls through to the layer below.
version: 1
view: iso        # topdown, side, iso or iso-true; sets the three below
pitch: null      # camera pitch, 0 to 90; null: the view's
directions: null # direction count, 1 to 64; null: the view's
start_angle: null  # angle of direction 0, degrees; null: the view's
model_yaw: 0     # degrees; corrects a model that does not face +Z
ppm: auto        # pixels per meter, greater than 0; auto: fitted
ground: [0, 0, 0]  # the ground point, meters, subject coordinates
ground_px: auto  # [x, y], the cell pixel corner it lands on; auto: fitted
supersample: 8   # capture resolution multiplier, 1 to 16
reduce: plain    # plain: alpha-weighted mean; mode: the most common colour
root_motion: error  # error or keep
blender: null    # the Blender executable, relative to the file; null:
                 # discovered. An app setting: never recorded in a sheet
any_blender: false  # true: allow another Blender version; an app setting
cell: auto       # WxH in pixels, each 1 to 4096; auto: fitted with the pixels
                 # per meter in force, else 64x64
fps: 12          # target sampling rate, greater than 0
frames: auto     # each clip's frame count, 1 or more; auto: by duration.
                 # A clips: mapping may give each clip its own
palette: null    # a .hex, .gpl or .png palette, relative to the file; null: none
materials: null  # a .yaml or .yml material library; null: none; needs a palette
edges: hard      # hard: a pixel shows when half its block does, crisp outlines;
                 # soft: its alpha is its block's mean alpha
previews: true   # false: write no animated previews
normals: true    # false: write no normal map (<stem>.normal.png)
depth: false     # true: write the depth map (<stem>.depth.png)
light:           # a point light for lit previews (<stem>-lit.<clip>.gif)
  position: null         # [x, y, z] in sheet pixels from the ground point,
                         # x right, y up, z toward the viewer; null: no light
  intensity: 1.0         # 0 or greater
  ambient: 0.3           # a surface facing away from the light, 0 to 1
shade:           # the material ramps' shade (design §Capture, Shade)
  ao_distance_m: 0.3     # how far occlusion looks, meters, greater than 0
  ao_samples: 64         # samples per pixel, 1 to 128
  occlusion_weight: 0.25 # 0 or greater
  convexity_weight: 1.0  # 0 or greater
  range: [84, 191]       # the shade values a ramp spans, 0 <= lo < hi <= 255
ramp:            # how a library's generated ramps are made (setting B)
  lightness_step: 0.12   # OKLab lightness lost per shade, 0 to 1
  hue_shift_deg: -12     # hue turned per shade, degrees, -180 to 180
  chroma_fade: 0.3       # chroma lost by the darkest shade, 0 to 1
